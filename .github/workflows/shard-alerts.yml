name: Refresh shard alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh saved shard alerts
        env:
          ALERTS_URL: ${{ secrets.SHARD_ALERTS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ALERTS_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ALERTS_URL/api/cron/shard-alerts"
